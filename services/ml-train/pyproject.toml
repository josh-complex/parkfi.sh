[project]
name = "parkfi-ml-train"
version = "0.1.0"
description = "Wait-time forecasting model service for parkfi.sh (train + infer). Postgres is the only contract with the app."
requires-python = ">=3.11"
dependencies = [
  "lightgbm>=4.3",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
